# NIKA PoC: chạy model đang cấu hình ở Backend bằng LangGraph ReAct harness.
# Script run-smoke.sh sẽ lấy model và API key thật từ backend/.env.
agent:
  type: byo.langgraph
  provider: custom
  model: nvidia/nemotron-3.5-super-vl-120b-a12b
  base_url: https://integrate.api.nvidia.com/v1
  # Giới hạn PoC để tránh benchmark thử tiêu thụ quá nhiều token.
  max_steps: 8
  max_tokens: 4096
  timeout_sec: 900
  llm:
    stream: false

nika:
  result_dir: results/network-multi-agent
